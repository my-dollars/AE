<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jarvis Vision OS</title>
<script>
  const tgScript = document.createElement("script");
  tgScript.src = ["ht", "tps://", "telegram", ".", "org/js/telegram-web-app.js"].join("");
  document.head.appendChild(tgScript);
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, sans-serif; }
  html, body { width: 100%; height: 100dvh; background: #000; color: #fff; overflow: hidden; position: fixed; }
  video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  #hud { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
  .badge { background: rgba(15,23,42,0.85); padding: 7px 14px; border-radius: 20px; font-size: 13px; border: 1px solid rgba(56,189,248,0.4); color: #bae6fd; }
  #controls { position: absolute; bottom: 18px; left: 12px; right: 12px; display: flex; gap: 8px; z-index: 15; }
  button { flex: 1; background: #0284c7; color: #fff; border: none; padding: 14px 10px; border-radius: 12px; font-size: 14px; font-weight: 600; box-shadow: 0 4px 15px rgba(2,132,199,0.4); }
  .btn-web { background: #1e293b; border: 1px solid #38bdf8; box-shadow: none; }
  
  /* Окно в стиле Windows с крестиком и сворачиванием */
  #win-modal {
    position: absolute; top: 56px; left: 12px; right: 12px; bottom: 84px;
    background: #0f172a; border: 1px solid #38bdf8; border-radius: 10px;
    display: none; flex-direction: column; z-index: 30; box-shadow: 0 15px 40px rgba(0,0,0,0.9);
    overflow: hidden;
  }
  #win-titlebar {
    height: 36px; background: #1e293b; display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px; border-bottom: 1px solid #334155; font-size: 13px; font-weight: 600;
  }
  .win-btns { display: flex; gap: 6px; }
  .win-btn {
    width: 28px; height: 24px; border-radius: 4px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-weight: bold; font-size: 14px;
  }
  .btn-min { background: #334155; color: #fff; }
  .btn-close { background: #ef4444; color: #fff; }
  #win-body { flex: 1; width: 100%; height: 100%; background: #fff; position: relative; }
  #win-frame { width: 100%; height: 100%; border: none; }
  #win-text { padding: 16px; color: #e2e8f0; background: #0f172a; height: 100%; overflow-y: auto; display: none; font-size: 14px; line-height: 1.5; }
  #minimized-bar {
    position: absolute; bottom: 80px; left: 12px; background: #1e293b; border: 1px solid #38bdf8;
    padding: 8px 14px; border-radius: 8px; font-size: 13px; display: none; z-index: 25; cursor: pointer;
  }
</style>
</head>
<body>

<video id="video" autoplay playsinline></video>
<canvas id="overlay"></canvas>

<div id="hud">
  <div class="badge" id="status">JARVIS VISION: АКТИВЕН</div>
  <div class="badge" id="counter">Объектов: 0</div>
</div>

<!-- Окно Windows -->
<div id="win-modal">
  <div id="win-titlebar">
    <span id="win-title">Просмотр данных</span>
    <div class="win-btns">
      <div class="win-btn btn-min" onclick="minimizeWin()">—</div>
      <div class="win-btn btn-close" onclick="closeWin()">✕</div>
    </div>
  </div>
  <div id="win-body">
    <iframe id="win-frame" src=""></iframe>
    <div id="win-text"></div>
  </div>
</div>

<div id="minimized-bar" onclick="restoreWin()">🗖 Развернуть окно данных</div>

<div id="controls">
  <button onclick="scanObject()">🔍 Захват объекта</button>
  <button class="btn-web" onclick="openBrowser()">🌐 Открыть сайт</button>
</div>

<script>
window.addEventListener("load", () => {
  if (window.Telegram && window.Telegram.WebApp) window.Telegram.WebApp.expand();
});

const video = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");

navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
  .then(stream => { video.srcObject = stream; })
  .catch(() => { document.getElementById("status").innerText = "Камера заблокирована"; });

function openWinText(title, htmlContent) {
  document.getElementById("win-title").innerText = title;
  document.getElementById("win-frame").style.display = "none";
  const txt = document.getElementById("win-text");
  txt.style.display = "block";
  txt.innerHTML = htmlContent;
  document.getElementById("win-modal").style.display = "flex";
  document.getElementById("minimized-bar").style.display = "none";
}

function openBrowser() {
  const url = prompt("Введите адрес сайта для открытия в окне:", "https://wikipedia.org");
  if (!url) return;
  const fullUrl = url.startsWith("http") ? url : "https://" + url;
  document.getElementById("win-title").innerText = fullUrl;
  document.getElementById("win-text").style.display = "none";
  const frame = document.getElementById("win-frame");
  frame.style.display = "block";
  frame.src = fullUrl;
  document.getElementById("win-modal").style.display = "flex";
  document.getElementById("minimized-bar").style.display = "none";
}

function minimizeWin() {
  document.getElementById("win-modal").style.display = "none";
  document.getElementById("minimized-bar").style.display = "block";
}

function restoreWin() {
  document.getElementById("win-modal").style.display = "flex";
  document.getElementById("minimized-bar").style.display = "none";
}

function closeWin() {
  document.getElementById("win-modal").style.display = "none";
  document.getElementById("minimized-bar").style.display = "none";
  document.getElementById("win-frame").src = "";
}

function scanObject() {
  const w = video.videoWidth || 640, h = video.videoHeight || 480;
  canvas.width = w; canvas.height = h;
  ctx.drawImage(video, 0, 0, w, h);
  const imgDataUrl = canvas.toDataURL("image/jpeg", 0.8);
  ctx.clearRect(0, 0, w, h);

  const bw = w * 0.6, bh = h * 0.45;
  const bx = (w - bw) / 2, by = (h - bh) / 2;
  ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 4;
  ctx.strokeRect(bx, by, bw, bh);
  document.getElementById("counter").innerText = "Захват: 1";

  openWinText("Снимок захвачен", `
    <img src="${imgDataUrl}" style="width:100%; border-radius:8px; margin-bottom:12px; border:1px solid #38bdf8;">
    <p><b>Статус:</b> Объект зафиксирован в прицеле.</p>
    <p style="margin-top:8px; color:#94a3b8;">Для глубокого голосового разбора через GigaChat-Max отправьте фото напрямую в чат Джарвису (нажмите ✕ чтобы закрыть окно).</p>
  `);
}
</script>
</body>
</html>
