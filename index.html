<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Substrate AR-Дефектоскоп</title>
<script>
  const tgScript = document.createElement("script");
  tgScript.src = ["ht", "tps://", "telegram", ".", "org/js/telegram-web-app.js"].join("");
  document.head.appendChild(tgScript);
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
  body { background: #000; color: #fff; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
  #viewport { position: relative; flex: 1; width: 100%; overflow: hidden; }
  video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  #hud { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; pointer-events: none; z-index: 5; }
  .badge { background: rgba(15,23,42,0.8); padding: 6px 12px; border-radius: 20px; font-size: 13px; border: 1px solid rgba(255,255,255,0.2); }
  #controls { padding: 14px; background: #0f172a; display: flex; gap: 10px; z-index: 10; }
  button { background: #ef4444; color: #fff; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 600; width: 100%; }
  button:disabled { opacity: 0.5; }
  #risk-card {
    position: absolute; bottom: 82px; left: 12px; right: 12px;
    background: rgba(15, 23, 42, 0.96); border: 1px solid #ef4444;
    border-radius: 16px; padding: 16px; display: none; z-index: 20;
    box-shadow: 0 10px 30px rgba(0,0,0,0.85);
  }
  #risk-card h3 { font-size: 17px; margin-bottom: 6px; color: #f87171; display: flex; justify-content: space-between; }
  #risk-card p { font-size: 14px; color: #e2e8f0; line-height: 1.4; margin-bottom: 8px; }
  .close-btn { color: #94a3b8; font-size: 20px; cursor: pointer; padding-left: 12px; }
</style>
</head>
<body>

<div id="viewport">
  <video id="video" autoplay playsinline></video>
  <canvas id="overlay"></canvas>
  <div id="hud">
    <div class="badge" id="status">AR-камера активна</div>
    <div class="badge" id="counter">Зон: 0</div>
  </div>
  <div id="risk-card">
    <h3><span id="card-title">Дефект</span><span class="close-btn" onclick="closeCard()">✕</span></h3>
    <p id="card-desc"></p>
    <p style="color: #fca5a5; font-weight: 600;" id="card-action"></p>
  </div>
</div>

<div id="controls">
  <button id="scan-btn" onclick="analyzeAR()">🔍 Сканировать поверхность</button>
</div>

<script>
window.addEventListener("load", () => {
  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.expand();
  }
});

const video = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");
let activeZones = [];

navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
  .then(stream => { video.srcObject = stream; })
  .catch(() => { document.getElementById("status").innerText = "Разрешите доступ к камере"; });

// Анализ цвета и текстуры кадра (выделение очагов ржавчины/трещин локально в AR без задержек)
function analyzeAR() {
  const status = document.getElementById("status");
  status.innerText = "Сканирование спектра...";

  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imgData.data;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  activeZones = [];

  const gridCols = 8, gridRows = 10;
  const cellW = canvas.width / gridCols;
  const cellH = canvas.height / gridRows;

  for (let r = 1; r < gridRows - 1; r++) {
    for (let c = 1; c < gridCols - 1; c++) {
      let rustPixels = 0, darkCrackPixels = 0, total = 0;
      const startX = Math.floor(c * cellW), startY = Math.floor(r * cellH);

      for (let y = startY; y < startY + cellH; y += 4) {
        for (let x = startX; x < startX + cellW; x += 4) {
          const i = (y * canvas.width + x) * 4;
          const R = data[i], G = data[i + 1], B = data[i + 2];
          total++;
          // Детекция спектра оксида железа (ржавчина/коррозия)
          if (R > 95 && G > 35 && G < 130 && B < 75 && (R - G) > 30 && (G - B) > 10) rustPixels++;
          // Детекция глубоких теневых разломов/трещин
          if (R < 45 && G < 45 && B < 45) darkCrackPixels++;
        }
      }

      if (rustPixels / total > 0.22) {
        drawZone(startX, startY, cellW, cellH, "#ef4444", "Коррозия металла (7/10)",
          "Активное окисление поверхности. Риск утонения стенки и разгерметизации узла.",
          "Зачистить до чистого металла, замерить толщину, нанести грунт-эмаль.");
      } else if (darkCrackPixels / total > 0.45) {
        drawZone(startX, startY, cellW, cellH, "#eab308", "Трещина / разлом (8/10)",
          "Нарушение целостности материала. Риск дальнейшего раскрытия под нагрузкой.",
          "Установить контрольные маяки, провести инъектирование или усиление узла.");
      }
    }
  }

  document.getElementById("counter").innerText = `Зон: ${activeZones.length}`;
  status.innerText = activeZones.length > 0 ? "Нажмите на цветную зону" : "Дефектов не выявлено";
}

function drawZone(x, y, w, h, color, title, risk, action) {
  ctx.fillStyle = color + "44";
  ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
  ctx.lineWidth = 3;
  ctx.strokeStyle = color;
  ctx.strokeRect(x + 2, y + 2, w - 4, h - 4);
  activeZones.push({ x, y, w, h, title, risk, action });
}

canvas.addEventListener("click", (e) => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const cx = (e.clientX - rect.left) * scaleX;
  const cy = (e.clientY - rect.top) * scaleY;

  for (let z of activeZones) {
    if (cx >= z.x && cx <= z.x + z.w && cy >= z.y && cy <= z.y + z.h) {
      document.getElementById("card-title").innerText = z.title;
      document.getElementById("card-desc").innerText = "Риск: " + z.risk;
      document.getElementById("card-action").innerText = "Меры: " + z.action;
      document.getElementById("risk-card").style.display = "block";
      return;
    }
  }
});

function closeCard() {
  document.getElementById("risk-card").style.display = "none";
}
</script>
</body>
</html>
