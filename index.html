<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jarvis Live Vision</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        #camera-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1;
        }
        
        #main-button {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 80px; height: 80px; border-radius: 50%;
            background: rgba(0, 120, 212, 0.8); border: 2px solid rgba(255, 255, 255, 0.5);
            z-index: 10; display: flex; align-items: center; justify-content: center;
            color: white; font-size: 28px; cursor: pointer; transition: transform 0.1s, background 0.2s;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }
        #main-button:active { transform: translateX(-50%) scale(0.9); background: rgba(0, 120, 212, 1); }
        #main-button.recording { background: rgba(255, 0, 0, 0.8); animation: pulse 1s infinite; }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(255, 0, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
        }

        #audio-player {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; background: rgba(30, 30, 30, 0.9);
            border-radius: 12px; padding: 12px; z-index: 20; display: none;
            flex-direction: column; gap: 8px; color: white; backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .player-controls { display: flex; align-items: center; justify-content: center; gap: 15px; }
        .player-btn {
            background: rgba(255,255,255,0.1); border: none; color: white; font-size: 16px; 
            cursor: pointer; padding: 8px 12px; border-radius: 6px; transition: background 0.2s;
        }
        .player-btn:active { background: rgba(255,255,255,0.2); }
        #progress-bar { width: 100%; cursor: pointer; accent-color: #0078d4; }
        #timer { font-size: 12px; text-align: center; color: #ccc; font-variant-numeric: tabular-nums; }

        .window {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; height: 70%; background: rgba(20, 20, 20, 0.95);
            border-radius: 12px; border: 1px solid #444; z-index: 30;
            display: none; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
        }
        .window-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 15px; background: #2d2d2d; border-radius: 12px 12px 0 0;
            color: white; font-weight: 600; font-size: 15px;
        }
        .window-controls { display: flex; gap: 12px; }
        .window-btn {
            background: none; border: none; color: #ccc; font-size: 20px; cursor: pointer; line-height: 1;
        }
        .window-btn:hover { color: white; }
        .window-content {
            flex: 1; padding: 15px; overflow-y: auto; color: white; display: flex; flex-direction: column; gap: 10px;
        }
        .window iframe {
            width: 100%; height: 100%; border: none; border-radius: 0 0 12px 12px; background: white;
        }

        .minimized-tab {
            position: absolute; right: 0; top: 50%; transform: translateY(-50%);
            background: rgba(0, 120, 212, 0.95); color: white;
            padding: 15px 6px; border-radius: 8px 0 0 8px; cursor: pointer;
            z-index: 25; display: none; writing-mode: vertical-rl; text-orientation: mixed;
            font-size: 13px; font-weight: bold; letter-spacing: 1px; box-shadow: -2px 0 10px rgba(0,0,0,0.3);
        }

        .chat-msg { padding: 10px 14px; border-radius: 12px; max-width: 85%; word-wrap: break-word; font-size: 15px; line-height: 1.4; }
        .chat-msg.user { background: #0078d4; align-self: flex-end; border-bottom-right-radius: 4px; }
        .chat-msg.ai { background: #3a3a3a; align-self: flex-start; border-bottom-left-radius: 4px; }
        
        #chat-input-area {
            display: flex; gap: 8px; padding: 12px; border-top: 1px solid #444; background: #252525; border-radius: 0 0 12px 12px;
        }
        #chat-input {
            flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #555; background: #1a1a1a; color: white; outline: none;
        }
        #chat-input:focus { border-color: #0078d4; }
        #chat-send {
            padding: 10px 16px; background: #0078d4; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>
    <video id="camera-video" autoplay playsinline muted></video>
    <canvas id="capture-canvas" style="display:none;"></canvas>

    <div id="audio-player">
        <div class="player-controls">
            <button class="player-btn" id="btn-rewind">-10с</button>
            <button class="player-btn" id="btn-play-pause">▶</button>
            <button class="player-btn" id="btn-forward">+10с</button>
        </div>
        <input type="range" id="progress-bar" value="0" min="0" max="100">
        <div id="timer">00:00 / 00:00</div>
    </div>

    <div id="main-button">🎤</div>

    <div id="chat-window" class="window">
        <div class="window-header">
            <span>Чат с Джарвисом</span>
            <div class="window-controls">
                <button class="window-btn" onclick="minimizeWindow('chat')">—</button>
                <button class="window-btn" onclick="closeWindow('chat')">✕</button>
            </div>
        </div>
        <div class="window-content" id="chat-messages"></div>
        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Введите сообщение...">
            <button id="chat-send">➤</button>
        </div>
    </div>
    <div id="chat-tab" class="minimized-tab" onclick="restoreWindow('chat')">ЧАТ</div>

    <div id="browser-window" class="window" style="width: 95%; height: 80%;">
        <div class="window-header">
            <span>Встроенный браузер</span>
            <div class="window-controls">
                <button class="window-btn" onclick="minimizeWindow('browser')">—</button>
                <button class="window-btn" onclick="closeWindow('browser')">✕</button>
            </div>
        </div>
        <iframe id="browser-iframe" src="about:blank"></iframe>
    </div>
    <div id="browser-tab" class="minimized-tab" onclick="restoreWindow('browser')">БРАУЗЕР</div>

    <script>
        const API_BASE = "https://lhr.life";
";
        
        const video = document.getElementById("camera-video");
        const canvas = document.getElementById("capture-canvas");
        const ctx = canvas.getContext("2d");
        let currentFrameBase64 = "";

        navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }, 
            audio: true 
        })
        .then(function(stream) { 
            video.srcObject = stream; 
            stream.getAudioTracks().forEach(function(t) { t.stop(); });
        })
        .catch(function(err) {
            console.error("Camera error:", err);
            alert("Не удалось получить доступ к камере или микрофону. Убедитесь, что вы разрешили доступ и используете HTTPS.");
        });

        setInterval(function() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                currentFrameBase64 = canvas.toDataURL("image/jpeg", 0.7);
            }
        }, 1500);

        const mainBtn = document.getElementById("main-button");
        let pressTimer;
        let isHolding = false;
        let recognition = null;

        if ("webkitSpeechRecognition" in window || "SpeechRecognition" in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = "ru-RU";
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = function(event) {
                const text = event.results.item(0).item(0).transcript;
                sendToBackend(text, true);
            };
            
            recognition.onerror = function(event) {
                stopRecording();
                addChatMessage("Ошибка микрофона: " + event.error, "ai");
                openWindow("chat");
            };
            
            recognition.onend = function() {
                stopRecording();
            };
        }

        function startRecording() {
            isHolding = true;
            mainBtn.classList.add("recording");
            mainBtn.textContent = "🔴";
            if (recognition) { 
                try { recognition.start(); } catch(e) {} 
            }
        }

        function stopRecording() {
            isHolding = false;
            mainBtn.classList.remove("recording");
            mainBtn.textContent = "🎤";
            if (recognition) { 
                try { recognition.stop(); } catch(e) {} 
            }
        }

        mainBtn.addEventListener("touchstart", function(e) {
            e.preventDefault();
            pressTimer = setTimeout(function() { startRecording(); }, 300);
        });

        mainBtn.addEventListener("touchend", function(e) {
            e.preventDefault();
            clearTimeout(pressTimer);
            if (!isHolding) {
                openWindow("chat");
            } else {
                stopRecording();
            }
        });

        mainBtn.addEventListener("mousedown", function() {
            pressTimer = setTimeout(function() { startRecording(); }, 300);
        });
        
        mainBtn.addEventListener("mouseup", function() {
            clearTimeout(pressTimer);
            if (!isHolding) {
                openWindow("chat");
            } else {
                stopRecording();
            }
        });

        function sendToBackend(text, voice) {
            addChatMessage(text, "user");
            mainBtn.textContent = "⏳";
            
            fetch(API_BASE + "/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text: text, image: currentFrameBase64, voice: voice })
            })
            .then(function(response) {
                if (!response.ok) {
                    throw new Error("Статус ответа: " + response.status);
                }
                return response.json();
            })
            .then(function(data) {
                addChatMessage(data.reply, "ai");
                
                if (data.action_url) {
                    document.getElementById("browser-iframe").src = data.action_url;
                    openWindow("browser");
                }
                
                if (data.has_audio) {
                    playAudio();
                }
            })
            .catch(function(err) {
                console.error("Backend error:", err);
                addChatMessage("Ошибка связи с сервером: " + err.message, "ai");
                openWindow("chat");
            })
            .finally(function() {
                mainBtn.textContent = "🎤";
            });
        }

        function addChatMessage(text, sender) {
            const container = document.getElementById("chat-messages");
            const div = document.createElement("div");
            div.className = "chat-msg " + sender;
            div.textContent = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        document.getElementById("chat-send").addEventListener("click", function() {
            const input = document.getElementById("chat-input");
            if (input.value.trim()) {
                sendToBackend(input.value.trim(), false);
                input.value = "";
            }
        });

        document.getElementById("chat-input").addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                document.getElementById("chat-send").click();
            }
        });

        function openWindow(name) {
            document.getElementById(name + "-window").style.display = "flex";
            document.getElementById(name + "-tab").style.display = "none";
        }

        function closeWindow(name) {
            document.getElementById(name + "-window").style.display = "none";
            document.getElementById(name + "-tab").style.display = "none";
            if (name === "browser") {
                document.getElementById("browser-iframe").src = "about:blank";
            }
        }

        function minimizeWindow(name) {
            document.getElementById(name + "-window").style.display = "none";
            document.getElementById(name + "-tab").style.display = "block";
        }

        function restoreWindow(name) {
            document.getElementById(name + "-window").style.display = "flex";
            document.getElementById(name + "-tab").style.display = "none";
        }

        const audio = new Audio(API_BASE + "/audio");
        const audioPlayer = document.getElementById("audio-player");
        const btnPlayPause = document.getElementById("btn-play-pause");
        const btnRewind = document.getElementById("btn-rewind");
        const btnForward = document.getElementById("btn-forward");
        const progressBar = document.getElementById("progress-bar");
        const timer = document.getElementById("timer");

        function playAudio() {
            audioPlayer.style.display = "flex";
            audio.load();
            audio.play().then(function() { 
                btnPlayPause.textContent = "⏸"; 
            }).catch(function(e) { 
                console.error("Audio play error:", e); 
            });
        }

        btnPlayPause.addEventListener("click", function() {
            if (audio.paused) { 
                audio.play(); 
                btnPlayPause.textContent = "⏸"; 
            } else { 
                audio.pause(); 
                btnPlayPause.textContent = "▶"; 
            }
        });

        btnRewind.addEventListener("click", function() { 
            audio.currentTime = Math.max(0, audio.currentTime - 10); 
        });
        
        btnForward.addEventListener("click", function() { 
            audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10); 
        });

        audio.addEventListener("timeupdate", function() {
            if (!isNaN(audio.duration)) {
                progressBar.value = (audio.currentTime / audio.duration) * 100;
                timer.textContent = formatTime(audio.currentTime) + " / " + formatTime(audio.duration);
            }
        });

        progressBar.addEventListener("input", function() {
            audio.currentTime = (progressBar.value / 100) * audio.duration;
        });

        audio.addEventListener("ended", function() {
            btnPlayPause.textContent = "▶";
            audioPlayer.style.display = "none";
        });

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return m.toString().padStart(2, "0") + ":" + s.toString().padStart(2, "0");
        }
    </script>
</body>
</html>
