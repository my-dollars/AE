<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AE Jarvis</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; padding: 0; overflow: hidden; background: #000; color: #00f0ff; font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
#camera { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 0; }
#capture { display: none; }

.window {
    position: fixed; top: 10%; left: 5%; width: 90%; height: 80%;
    background: rgba(0, 10, 20, 0.85); backdrop-filter: blur(16px);
    border: 1px solid #00f0ff; border-radius: 12px; z-index: 10;
    transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    display: none; flex-direction: column;
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.15), inset 0 0 20px rgba(0, 240, 255, 0.05);
}
.window-header {
    height: 36px; display: flex; justify-content: flex-end; align-items: center;
    padding: 0 12px; border-bottom: 1px solid rgba(0, 240, 255, 0.3);
}
.win-btn {
    margin-left: 16px; cursor: pointer; font-size: 20px; color: #00f0ff;
    opacity: 0.8; transition: all 0.2s; line-height: 1;
}
.win-btn:hover { opacity: 1; text-shadow: 0 0 8px #00f0ff; }
.window-content { flex: 1; overflow: hidden; position: relative; display: flex; flex-direction: column; }

#minimized-icon {
    position: fixed; right: 0; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; background: rgba(0, 240, 255, 0.15);
    border: 1px solid #00f0ff; border-right: none; border-radius: 8px 0 0 8px;
    z-index: 20; display: none; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 0 15px #00f0ff; font-size: 20px;
}

#main-button {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
    width: 72px; height: 72px; border-radius: 50%;
    border: 2px solid #00f0ff; background: rgba(0, 240, 255, 0.1);
    box-shadow: 0 0 20px #00f0ff, inset 0 0 10px #00f0ff;
    z-index: 30; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.2s;
}
#main-button::after {
    content: ""; width: 24px; height: 24px; border-radius: 50%;
    background: #00f0ff; opacity: 0.8;
}
#main-button.pulsing {
    border-color: #ff003c; background: rgba(255, 0, 60, 0.15);
    box-shadow: 0 0 25px #ff003c, inset 0 0 15px #ff003c;
    animation: pulseCrimson 1s infinite;
}
#main-button.pulsing::after { background: #ff003c; }

@keyframes pulseCrimson {
    0% { box-shadow: 0 0 20px #ff003c, inset 0 0 10px #ff003c; }
    50% { box-shadow: 0 0 45px #ff003c, inset 0 0 25px #ff003c; }
    100% { box-shadow: 0 0 20px #ff003c, inset 0 0 10px #ff003c; }
}

#audio-player {
    position: fixed; top: 12px; left: 5%; width: 90%;
    background: rgba(0, 10, 20, 0.9); backdrop-filter: blur(16px);
    border: 1px solid #00f0ff; border-radius: 8px; padding: 10px;
    z-index: 40; display: none; flex-direction: column; gap: 8px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
}
.audio-controls { display: flex; align-items: center; gap: 10px; }
.audio-btn {
    background: transparent; border: 1px solid #00f0ff; color: #00f0ff;
    border-radius: 4px; padding: 6px 12px; cursor: pointer; font-size: 14px;
}
.audio-btn:active { background: rgba(0, 240, 255, 0.2); }
#seek-bar { flex: 1; accent-color: #00f0ff; cursor: pointer; }
#time-display { font-size: 12px; color: #00f0ff; min-width: 80px; text-align: right; }

#chat-messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.msg { padding: 10px 14px; border-radius: 8px; max-width: 85%; line-height: 1.4; font-size: 14px; }
.msg.user { background: rgba(0, 240, 255, 0.2); align-self: flex-end; border: 1px solid rgba(0, 240, 255, 0.4); }
.msg.ai { background: rgba(255, 255, 255, 0.08); align-self: flex-start; border: 1px solid rgba(255, 255, 255, 0.15); }
#chat-input-area { display: flex; padding: 12px; border-top: 1px solid rgba(0, 240, 255, 0.3); gap: 8px; }
#chat-input {
    flex: 1; background: rgba(0, 240, 255, 0.08); border: 1px solid #00f0ff;
    color: #fff; padding: 10px; border-radius: 6px; outline: none; font-size: 14px;
}
#chat-input:focus { box-shadow: 0 0 10px rgba(0, 240, 255, 0.3); }
#chat-send {
    background: #00f0ff; color: #000; border: none; padding: 10px 18px;
    border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px;
}
#chat-send:active { background: #00c4cf; }

iframe { width: 100%; height: 100%; border: none; background: transparent; }
</style>
</head>
<body>

<video id="camera" autoplay playsinline muted></video>
<canvas id="capture"></canvas>

<div id="audio-player">
    <div class="audio-controls">
        <button class="audio-btn" id="rewind">-10s</button>
        <button class="audio-btn" id="play-pause">Play</button>
        <button class="audio-btn" id="forward">+10s</button>
        <input type="range" id="seek-bar" value="0" step="0.1">
        <span id="time-display">0:00 / 0:00</span>
    </div>
    <audio id="audio-el" preload="auto"></audio>
</div>

<div id="main-button"></div>

<div id="minimized-icon"></div>

<div id="chat-window" class="window">
    <div class="window-header">
        <span class="win-btn minimize-btn" onclick="minimizeWindow('chat-window')">&#8212;</span>
        <span class="win-btn close-btn" onclick="closeWindow('chat-window')">&#10005;</span>
    </div>
    <div class="window-content">
        <div id="chat-messages"></div>
        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Введите сообщение...">
            <button id="chat-send">Send</button>
        </div>
    </div>
</div>

<div id="web-window" class="window">
    <div class="window-header">
        <span class="win-btn minimize-btn" onclick="minimizeWindow('web-window')">&#8212;</span>
        <span class="win-btn close-btn" onclick="closeWindow('web-window')">&#10005;</span>
    </div>
    <div class="window-content">
        <iframe id="web-iframe"></iframe>
    </div>
</div>

<script>
const API_BASE = "https://d1e311cb3f5872.app.lhr.life";
let lastFrame = "";
let holdTimer = null;
let isHolding = false;
let holdStartTime = 0;
let recognition = null;

if ("SpeechRecognition" in window || "webkitSpeechRecognition" in window) {
    var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = "ru-RU";
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.onresult = function(event) {
        var text = event.results[0][0].transcript;
        sendToServer(text, true);
    };
    recognition.onerror = function(event) {
        console.error("Speech error", event.error);
    };
}

if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
}

navigator.mediaDevices.getUserMedia({
    video: {
        facingMode: "environment",
        width: { ideal: 1920 },
        height: { ideal: 1080 }
    }
}).then(function(stream) {
    document.getElementById("camera").srcObject = stream;
}).catch(function(err) {
    console.error("Camera error:", err);
});

setInterval(function() {
    var video = document.getElementById("camera");
    var canvas = document.getElementById("capture");
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = 1024;
        canvas.height = (1024 * video.videoHeight) / video.videoWidth;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        lastFrame = canvas.toDataURL("image/jpeg", 0.8);
    }
}, 1200);

var mainBtn = document.getElementById("main-button");

function startHold(e) {
    if (e.cancelable) e.preventDefault();
    isHolding = true;
    holdStartTime = Date.now();
    holdTimer = setTimeout(function() {
        if (isHolding) {
            mainBtn.classList.add("pulsing");
            if (recognition) {
                try { recognition.start(); } catch(err) {}
            }
        }
    }, 300);
}

function endHold(e) {
    if (e.cancelable) e.preventDefault();
    clearTimeout(holdTimer);
    var holdDuration = Date.now() - holdStartTime;
    if (isHolding) {
        isHolding = false;
        mainBtn.classList.remove("pulsing");
        if (holdDuration < 300) {
            openWindow("chat-window");
        } else {
            if (recognition) {
                try { recognition.stop(); } catch(err) {}
            }
        }
    }
}

mainBtn.addEventListener("touchstart", startHold, { passive: false });
mainBtn.addEventListener("touchend", endHold, { passive: false });
mainBtn.addEventListener("mousedown", startHold);
mainBtn.addEventListener("mouseup", endHold);
mainBtn.addEventListener("mouseleave", endHold);

function sendToServer(text, isVoice) {
    addMessage(text, "user");
    var payload = { text: text, image: lastFrame, voice: isVoice };
    fetch(API_BASE + "/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    }).then(function(res) {
        return res.json();
    }).then(function(data) {
        if (data.reply) {
            addMessage(data.reply, "ai");
        }
        if (data.has_audio) {
            playAudio();
        }
        if (data.action_url || data.web_code) {
            openWebWindow(data.action_url, data.web_code);
        }
    }).catch(function(err) {
        console.error("Fetch error:", err);
    });
}

function addMessage(text, sender) {
    var container = document.getElementById("chat-messages");
    var div = document.createElement("div");
    div.className = "msg " + sender;
    div.innerText = text;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

document.getElementById("chat-send").addEventListener("click", function() {
    var input = document.getElementById("chat-input");
    var text = input.value.trim();
    if (text) {
        sendToServer(text, false);
        input.value = "";
    }
});

document.getElementById("chat-input").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        document.getElementById("chat-send").click();
    }
});

var audioEl = document.getElementById("audio-el");

function playAudio() {
    var player = document.getElementById("audio-player");
    player.style.display = "flex";
    audioEl.src = API_BASE + "/audio?t=" + Date.now();
    audioEl.play().catch(function(e) { console.log("Audio play failed", e); });
    document.getElementById("play-pause").innerText = "Pause";
}

document.getElementById("play-pause").addEventListener("click", function() {
    if (audioEl.paused) {
        audioEl.play();
        this.innerText = "Pause";
    } else {
        audioEl.pause();
        this.innerText = "Play";
    }
});

document.getElementById("rewind").addEventListener("click", function() {
    audioEl.currentTime = Math.max(0, audioEl.currentTime - 10);
});

document.getElementById("forward").addEventListener("click", function() {
    audioEl.currentTime = Math.min(audioEl.duration || 0, audioEl.currentTime + 10);
});

document.getElementById("seek-bar").addEventListener("input", function() {
    audioEl.currentTime = this.value;
});

audioEl.addEventListener("timeupdate", function() {
    var seek = document.getElementById("seek-bar");
    if (!isNaN(audioEl.duration)) {
        seek.max = audioEl.duration;
        seek.value = audioEl.currentTime;
        document.getElementById("time-display").innerText = formatTime(audioEl.currentTime) + " / " + formatTime(audioEl.duration);
    }
});

audioEl.addEventListener("play", function() {
    document.getElementById("play-pause").innerText = "Pause";
});

audioEl.addEventListener("pause", function() {
    document.getElementById("play-pause").innerText = "Play";
});

function formatTime(s) {
    var m = Math.floor(s / 60);
    var sec = Math.floor(s % 60);
    return m + ":" + (sec < 10 ? "0" : "") + sec;
}

function openWindow(id) {
    closeAllWindows();
    document.getElementById(id).style.display = "flex";
}

function closeAllWindows() {
    var wins = document.querySelectorAll(".window");
    for (var i = 0; i < wins.length; i++) {
        wins[i].style.display = "none";
    }
    document.getElementById("minimized-icon").style.display = "none";
}

function minimizeWindow(id) {
    document.getElementById(id).style.display = "none";
    var icon = document.getElementById("minimized-icon");
    icon.style.display = "flex";
    icon.setAttribute("data-target", id);
    if (id === "chat-window") {
        icon.innerHTML = "&#128172;";
    } else {
        icon.innerHTML = "&#127760;";
    }
}

function closeWindow(id) {
    document.getElementById(id).style.display = "none";
    document.getElementById("minimized-icon").style.display = "none";
}

document.getElementById("minimized-icon").addEventListener("click", function() {
    var target = this.getAttribute("data-target");
    if (target) {
        document.getElementById(target).style.display = "flex";
        this.style.display = "none";
    }
});

function openWebWindow(url, code) {
    var iframe = document.getElementById("web-iframe");
    if (code) {
        iframe.srcdoc = code;
    } else if (url) {
        iframe.src = url;
    }
    openWindow("web-window");
}
</script>
</body>
</html>
