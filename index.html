<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>JARVIS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#050a12; --panel:#0a1626; --line:#123a5c; --accent:#00d4ff;
  --accent2:#ffaa00; --text:#cfe9ff; --dim:#5a7a99;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:radial-gradient(1200px 800px at 50% -10%,#0b2038 0%,var(--bg) 60%);
  color:var(--text); font-family:'Segoe UI',Roboto,monospace; height:100vh;
  overflow:hidden; display:flex; flex-direction:column;
}
#header{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-bottom:1px solid var(--line); background:rgba(10,22,38,.9);
}
#core{
  width:38px;height:38px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#7ff0ff,#0077aa 60%,#002233);
  box-shadow:0 0 18px var(--accent),0 0 40px rgba(0,212,255,.35);
  animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
#title{font-size:18px;letter-spacing:3px;color:var(--accent);font-weight:700}
#status{font-size:11px;color:var(--dim)}
#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:9px 12px;border-radius:12px;font-size:14px;line-height:1.4;
  border:1px solid var(--line); white-space:pre-wrap; word-break:break-word}
.msg.user{align-self:flex-end;background:#0d2b45;border-color:#1c5a86}
.msg.bot{align-self:flex-start;background:var(--panel)}
.msg .link{display:block;color:var(--accent);margin-top:4px;word-break:break-all}
#camWrap{display:none;position:relative;margin:0 12px;border:1px solid var(--line);
  border-radius:10px;overflow:hidden;background:#000}
#cam{display:block;width:100%;max-height:180px;object-fit:cover}
#camClose{position:absolute;top:6px;right:8px;background:rgba(0,0,0,.6);color:#fff;
  border:1px solid var(--line);border-radius:6px;padding:2px 8px}
#inputBar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);
  background:rgba(10,22,38,.95)}
#input{flex:1;background:#071525;border:1px solid var(--line);border-radius:10px;
  color:var(--text);padding:10px 12px;font-size:14px;outline:none}
.btn{background:#0d2b45;border:1px solid var(--accent);color:var(--accent);
  border-radius:10px;padding:10px 13px;font-size:16px;cursor:pointer}
.btn:active{background:#154e77}
.btn.rec{border-color:#ff3355;color:#ff3355;animation:pulse 1s infinite}
/* === floating windows manager (Windows-style) === */
.win{position:fixed;left:8px;top:80px;width:calc(100vw - 24px);max-height:70vh;
  background:rgba(6,16,28,.97);border:1px solid var(--accent);border-radius:10px;
  box-shadow:0 8px 30px rgba(0,0,0,.7);display:flex;flex-direction:column;z-index:50;
  animation:open .18s ease}
@keyframes open{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.winbar{display:flex;align-items:center;gap:8px;padding:6px 8px;cursor:grab;
  background:#0d2b45;border-bottom:1px solid var(--line);border-radius:9px 9px 0 0;
  touch-action:none;user-select:none}
.winbar .wt{flex:1;font-size:13px;color:var(--accent);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.wbtn{width:28px;height:24px;border:none;border-radius:5px;font-size:13px;cursor:pointer;
  background:#123a5c;color:var(--text)}
.wbtn.x{background:#7a1020}
.winbody{overflow-y:auto;padding:10px;font-size:13px}
.resItem{padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;
  background:var(--panel)}
.resItem a{color:var(--accent);font-size:14px;display:block;margin-bottom:4px}
.resItem p{color:var(--dim);font-size:12px}
.webframe{width:100%;height:50vh;border:none;background:#fff;border-radius:6px}
/* minimized dock at the RIGHT edge */
#dock{position:fixed;right:0;top:30%;display:flex;flex-direction:column;gap:6px;z-index:60}
.dockBtn{writing-mode:vertical-rl;transform:rotate(180deg);
  background:#0d2b45;border:1px solid var(--accent);border-right:none;
  border-radius:8px 0 0 8px;color:var(--accent);padding:10px 4px;font-size:11px;
  max-height:110px;overflow:hidden;cursor:pointer}
</style>
</head>
<body>
<div id="header">
  <div id="core"></div>
  <div>
    <div id="title">J.A.R.V.I.S.</div>
    <div id="status">готов</div>
  </div>
</div>

<div id="chat"></div>

<div id="camWrap">
  <video id="cam" autoplay playsinline muted></video>
  <button id="camClose">✕</button>
</div>

<div id="inputBar">
  <button class="btn" id="micBtn" title="Голос">🎙</button>
  <button class="btn" id="camBtn" title="Зрение">📷</button>
  <input id="input" placeholder="Спроси что-нибудь…" autocomplete="off">
  <button class="btn" id="sendBtn">➤</button>
</div>

<div id="dock"></div>

<script>
/* ==================== SETTINGS ==================== */
const TUNNEL_URL = "https://PASTE-YOUR-TUNNEL-URL.trycloudflare.com"; // <- your HTTPS tunnel to Termux
const API = TUNNEL_URL.replace(/\/$/, "");
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();

/* ==================== UI helpers ==================== */
const chat = document.getElementById('chat');
const statusEl = document.getElementById('status');
let history = [];

function setStatus(t){ statusEl.textContent = t; }
function addMsg(text, cls){
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

/* ==================== Floating window manager ==================== */
const dock = document.getElementById('dock');
let winCount = 0;

function createWindow(title, bodyHTML, opts = {}){
  const id = 'win' + (++winCount);
  const win = document.createElement('div');
  win.className = 'win';
  win.id = id;
  win.style.top = (70 + winCount * 24) + 'px';
  win.style.zIndex = 50 + winCount;
  win.innerHTML = `
    <div class="winbar">
      <span class="wt">${title}</span>
      <button class="wbtn min" title="Свернуть">_</button>
      <button class="wbtn x" title="Закрыть">✕</button>
    </div>
    <div class="winbody">${bodyHTML}</div>`;
  document.body.appendChild(win);

  const bar = win.querySelector('.winbar');
  bar.querySelector('.x').onclick = () => { win.remove(); dockBtn?.remove(); };
  const dockBtn = document.createElement('button');
  dockBtn.className = 'dockBtn'; dockBtn.textContent = title;
  dockBtn.onclick = () => { win.style.display = 'flex'; dockBtn.remove(); };
  bar.querySelector('.min').onclick = () => {
    win.style.display = 'none'; dock.appendChild(dockBtn);
  };

  /* drag by title bar */
  let sx, sy, ox, oy, drag = false;
  bar.addEventListener('pointerdown', e => {
    drag = true; sx = e.clientX; sy = e.clientY;
    ox = win.offsetLeft; oy = win.offsetTop;
    bar.setPointerCapture(e.pointerId);
  });
  bar.addEventListener('pointermove', e => {
    if (!drag) return;
    win.style.left = Math.max(0, Math.min(innerWidth - 60, ox + e.clientX - sx)) + 'px';
    win.style.top  = Math.max(50, Math.min(innerHeight - 80, oy + e.clientY - sy)) + 'px';
  });
  bar.addEventListener('pointerup', () => drag = false);
  return win;
}

function showResults(query, results){
  if (!results.length){
    createWindow('Поиск: ' + query, '<p>Ничего не найдено.</p>');
    return;
  }
  const html = results.map(r => `
    <div class="resItem">
      <a href="${r.url}" target="_blank">${r.title}</a>
      <p>${r.snippet || ''}</p>
    </div>`).join('');
  createWindow('🔎 ' + query, html);
}

function openSite(url){
  createWindow(url, `<iframe class="webframe" src="${url}" sandbox="allow-scripts allow-same-origin"></iframe>`);
}

/* ==================== Chat ==================== */
async function sendChat(text){
  addMsg(text, 'user');
  history.push({role: 'user', content: text});
  setStatus('думаю…');
  try {
    const r = await fetch(API + '/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text, history: history.slice(0, -1)})
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    addMsg(d.answer, 'bot');
    speak(d.answer);
    history.push({role: 'assistant', content: d.answer});
  } catch(e){
    addMsg('Ошибка связи с бэкендом: ' + e.message, 'bot');
  }
  setStatus('готов');
}

/* ==================== Web search ==================== */
async function doSearch(q){
  setStatus('ищу в интернете…');
  addMsg('🔎 ' + q, 'user');
  try {
    const r = await fetch(API + '/api/search?q=' + encodeURIComponent(q));
    const d = await r.json();
    showResults(d.query || q, d.results || []);
    if (d.results?.length){
      addMsg('Нашёл ' + d.results.length + ' результатов — открыл окно.', 'bot');
    } else {
      addMsg('Ничего не найдено.', 'bot');
    }
  } catch(e){
    addMsg('Ошибка поиска: ' + e.message, 'bot');
  }
  setStatus('готов');
}

/* ==================== Vision ==================== */
const camWrap = document.getElementById('camWrap');
const cam = document.getElementById('cam');
let stream = null;

async function toggleCam(){
  if (stream){
    stream.getTracks().forEach(t => t.stop());
    stream = null; camWrap.style.display = 'none';
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}});
    cam.srcObject = stream;
    camWrap.style.display = 'block';
  } catch(e){ addMsg('Нет доступа к камере: ' + e.message, 'bot'); }
}
document.getElementById('camClose').onclick = toggleCam;

async function captureAndAnalyze(prompt){
  if (!stream) return;
  setStatus('смотрю…');
  const c = document.createElement('canvas');
  c.width = cam.videoWidth; c.height = cam.videoHeight;
  c.getContext('2d').drawImage(cam, 0, 0);
  const b64 = c.toDataURL('image/jpeg', 0.7);
  try {
    const r = await fetch(API + '/api/vision', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({image: b64, prompt: prompt || 'Опиши, что ты видишь, и ответь голосом кратко.'})
    });
    const d = await r.json();
    addMsg(d.answer || d.error, 'bot');
    speak(d.answer || '');
  } catch(e){ addMsg('Ошибка зрения: ' + e.message, 'bot'); }
  setStatus('готов');
}

/* ==================== Voice ==================== */
function speak(text){
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/https?:\/\/\S+/g, 'ссылка'));
  u.lang = 'ru-RU'; u.rate = 1.05;
  speechSynthesis.speak(u);
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
const micBtn = document.getElementById('micBtn');

function startRec(){
  if (!SR){ addMsg('Распознавание речи не поддерживается браузером.', 'bot'); return; }
  rec = new SR();
  rec.lang = 'ru-RU'; rec.interimResults = false;
  rec.onresult = e => {
    const text = e.results[0][0].transcript;
    addMsg('🎙 ' + text, 'user');
    handleCommand(text);
  };
  rec.onend = () => { listening = false; micBtn.classList.remove('rec'); };
  rec.onerror = () => { listening = false; micBtn.classList.remove('rec'); };
  rec.start();
  listening = true; micBtn.classList.add('rec');
  setStatus('слушаю…');
}

/* ==================== Command router ==================== */
function handleCommand(text){
  const t = text.trim();
  const lower = t.toLowerCase();
  const mSearch = lower.match(/^(найди|поиск|загугли|поищи)\s+(.+)/);
  const mOpen = lower.match(/^(открой|зайди на|покажи сайт)\s+(.+)/);

  if (mSearch){ doSearch(mSearch[2]); return; }
  if (mOpen){
    let url = mOpen[2].trim();
    if (!/^https?:\/\//.test(url)) url = 'https://' + url;
    openSite(url); return;
  }
  if (/что ты видишь|что видишь|сфотографируй|смотри/.test(lower)){
    if (stream){ captureAndAnalyze(t); } else { toggleCam(); }
    return;
  }
  sendChat(t);
}

/* ==================== Events ==================== */
document.getElementById('sendBtn').onclick = () => {
  const inp = document.getElementById('input');
  const t = inp.value.trim();
  if (!t) return;
  inp.value = '';
  handleCommand(t);
};
document.getElementById('input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('sendBtn').click();
});
document.getElementById('camBtn').onclick = () => {
  if (stream) captureAndAnalyze();
  else toggleCam();
};
micBtn.onclick = () => listening ? rec?.stop() : startRec();

addMsg('JARVIS онлайн. Говори или пиши. Команды: «найди …», «открой …», «что ты видишь».', 'bot');
fetch(API + '/health').then(r => r.json()).then(() => setStatus('бэкенд подключён'))
  .catch(() => setStatus('⚠ бэкенд недоступен — проверь TUNNEL_URL'));
</script>
</body>
</html>
